[package]
name = "redrob-board"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Redrob Board desktop app (egui): place, route, check and export from one window"
default-run = "redrob-board"
build = "build.rs"

[dependencies]
board-units = { workspace = true }
board-geom = { workspace = true }
board-layout = { workspace = true }
board-netlist = { workspace = true }
board-designs = { workspace = true }
board-drc = { workspace = true }
board-place = { workspace = true }
board-agent = { workspace = true }
board-chat = { workspace = true, optional = true }
serde_json = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow", "x11", "wayland"] }
# The command line (src/cli): `redrob-board pipeline|tool|examples|drc|kicad-export|gerber-compare`.
board-kicad = { workspace = true }
board-gerber = { workspace = true }

[features]
# The AGENT palette (engine connection over the network).
default = ["agent"]
agent = ["board-chat"]

# The command line attaches to the console it was started from (src/cli/mod.rs).
[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }

[build-dependencies]
# Icon + VERSIONINFO for redrob-board.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[lints]
workspace = true

[lib]
name = "board_app"
path = "src/lib.rs"

[[bin]]
name = "redrob-board"
path = "src/main.rs"
