[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/redrob-labs/redrob-board"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
board-units = { path = "crates/units" }
board-geom = { path = "crates/geom" }
board-netlist = { path = "crates/netlist" }
board-schematic = { path = "crates/schematic" }
board-layout = { path = "crates/layout" }
board-gerber = { path = "crates/gerber" }
board-lib = { path = "crates/lib" }
board-drc = { path = "crates/drc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
