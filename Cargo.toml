[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/redrob-labs/redrob-board"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
board-units = { path = "crates/units" }
board-geom = { path = "crates/geom" }
board-netlist = { path = "crates/netlist" }
board-schematic = { path = "crates/schematic" }
board-layout = { path = "crates/layout" }
board-gerber = { path = "crates/gerber" }
board-lib = { path = "crates/lib" }
board-drc = { path = "crates/drc" }
board-designs = { path = "crates/designs" }
board-kicad = { path = "crates/kicad" }
board-place = { path = "crates/place" }
board-route = { path = "crates/route" }
board-oracle = { path = "crates/oracle" }
board-bom = { path = "crates/bom" }
board-agent = { path = "crates/agent" }
redrob-board = { path = "crates/app" }
board-chat = { path = "crates/chat" }
board-catalog = { path = "crates/catalog" }
board-sim = { path = "crates/sim" }
redrob-engine-client = { git = "https://github.com/redrob-labs/redrob-code", tag = "v0.6.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = { version = "0.36", default-features = false }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

