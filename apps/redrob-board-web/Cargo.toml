[package]
name = "redrob-board-web"
description = "Redrob Board in the browser: place, route, check and preview a board without installing anything"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "redrob-board-web"
path = "src/main.rs"

[dependencies]
# No `agent` feature: the browser has no engine to talk to, and the palette says so.
redrob-board = { workspace = true, default-features = false }
egui = { workspace = true }
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
