<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redrob Board</title>
  <link data-trunk rel="rust" data-bin="redrob-board-web" data-cargo-profile="wasm-release" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="icon" href="../../assets/app-icon/hicolor/64x64/apps/ai.redrob.board.png" />

    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #22282f; }
    #board_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      letter-spacing: 0.15em; text-transform: uppercase; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="board_canvas"></canvas>
  <div id="board_loading">Loading Redrob Board&hellip;</div>
</body>
</html>
